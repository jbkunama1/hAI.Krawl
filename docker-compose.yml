services:
  krawl:
    image: ghcr.io/jbkunama1/hai.krawl:latest
    container_name: hai-krawl
    pull_policy: always
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - krawl_data:/app/data
      # Optional: eigene HTML-Fake-Seite einbinden.
      # Lokale Datei nach /templates mounten, z.B.:
      # - ./templates/custom_page.html:/templates/custom_page.html:ro
      # Dann den Pfad im Container aktivieren:
      # (KRAWL_CUSTOM_TEMPLATE_PATH=/templates/custom_page.html)
    environment:
      - KRAWL_DASHBOARD_SECRET_PATH=${KRAWL_DASHBOARD_SECRET_PATH:-/home/KRAWL}
      # Passwort fuer geschuetzte Dashboard-Panels.
      # ACHTUNG:
      # - Wenn im Portainer-Stack-Environment NICHT gesetzt: Container generiert
      #   ein zufaelliges Passwort (steht dann in den Container-Logs).
      # - Leer setzen ("KRAWL_DASHBOARD_PASSWORD=") deaktiviert den Login komplett
      #   (nicht empfohlen!).
      # - WICHTIG (Portainer-Fix): Docker Compose loest ${VAR} zu einem LEEREN
      #   STRING auf, wenn die Variable im Stack-Environment fehlt - das ist NICHT
      #   dasselbe wie "nicht gesetzt" und kann in der App zu einem Login-Fehler
      #   fuehren, obwohl du (vermeintlich) ein Passwort konfiguriert hast.
      #   Deshalb greift hier ein expliziter Default, der niemals leer ist:
      - KRAWL_DASHBOARD_PASSWORD=${KRAWL_DASHBOARD_PASSWORD:-__KRAWL_AUTOGEN__}
      - KRAWL_DELAY=${KRAWL_DELAY:-100}
      - KRAWL_CANARY_TOKEN_URL=${KRAWL_CANARY_TOKEN_URL:-}
      # Pfad im Container zu einer eigenen HTML-Fake-Seite. Muss {counter} und {content} enthalten.
      - KRAWL_CUSTOM_TEMPLATE_PATH=${KRAWL_CUSTOM_TEMPLATE_PATH:-}
      # KI-generierte Fake-Seiten (AI-Generated Deception Pages), optional.
      # Standard: ausgeschaltet. Aktivieren = KRAWL_AI_ENABLED=true + API-Key.
      # Defaults entsprechen dem gebackenen Upstream config.yaml.
      - KRAWL_AI_ENABLED=${KRAWL_AI_ENABLED:-false}
      - KRAWL_AI_PROVIDER=${KRAWL_AI_PROVIDER:-openrouter}          # "openrouter" oder "openai"
      - KRAWL_AI_OPENAI_BASE_URL=${KRAWL_AI_OPENAI_BASE_URL:-https://api.openai.com/v1}  # nur relevant fuer provider "openai" (z.B. self-hosted http://krawl-llm:8080/v1)
      - KRAWL_AI_API_KEY=${KRAWL_AI_API_KEY:-}
      - KRAWL_AI_MODEL=${KRAWL_AI_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - KRAWL_AI_TIMEOUT=${KRAWL_AI_TIMEOUT:-300}
      - KRAWL_AI_MAX_DAILY_REQUESTS=${KRAWL_AI_MAX_DAILY_REQUESTS:-100}   # 0 = unbegrenzt
      - KRAWL_AI_REASONING_ENABLED=${KRAWL_AI_REASONING_ENABLED:-false}   # nur fuer OpenRouter-Modelle mit Reasoning
      - KRAWL_AI_REASONING_EFFORT=${KRAWL_AI_REASONING_EFFORT:-medium}    # none, minimal, low, medium, high, xhigh
      - KRAWL_LOG_LEVEL=${KRAWL_LOG_LEVEL:-INFO}
      - TZ=${TZ:-Europe/Berlin}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000${KRAWL_DASHBOARD_SECRET_PATH:-/home/KRAWL}', timeout=8)"]

volumes:
  krawl_data:
