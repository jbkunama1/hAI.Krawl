# ============================================================
# Portainer Stack: Krawl
# Deploy via: Portainer > Stacks > Add Stack > Repository
# Repo URL: https://github.com/jbkunama1/hAI.Krawl
# Compose path: docker-compose.yml
# ============================================================

services:
  krawl:
    build:
      context: https://github.com/BlessedRebuS/Krawl.git
      dockerfile: Dockerfile
    image: krawl:latest
    container_name: hai-krawl
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - krawl_data:/app/data
      # Eigene Fake-Seite als Template nutzen (optional):
      # Beispiel-Template liegt im Repo unter templates/custom_page.html.
      # Auf dem Host einen Ordner anlegen, Template hineinkopieren und mounten:
      # - ${KRAWL_TEMPLATES_HOST_DIR:-./templates}:/templates:ro
      # Dann den Pfad im Container aktivieren:
      # (KRAWL_CUSTOM_TEMPLATE_PATH=/templates/custom_page.html)

    environment:
      # Geheimer Dashboard-Pfad (muss mit / beginnen)
      - KRAWL_DASHBOARD_SECRET_PATH=${KRAWL_DASHBOARD_SECRET_PATH:-/home/KRAWL}
      - KRAWL_DELAY=${KRAWL_DELAY:-100}
      - KRAWL_CANARY_TOKEN_URL=${KRAWL_CANARY_TOKEN_URL:-}
      # Pfad im Container zu einer eigenen HTML-Fake-Seite. Muss {counter} und {content} enthalten.
      # Leer lassen = Standard-Seite. Nur aktiv, wenn der Ordner per Volume gemountet ist.
      - KRAWL_CUSTOM_TEMPLATE_PATH=${KRAWL_CUSTOM_TEMPLATE_PATH:-}
      - KRAWL_LOG_LEVEL=${KRAWL_LOG_LEVEL:-INFO}
      - TZ=${TZ:-Europe/Berlin}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000${KRAWL_DASHBOARD_SECRET_PATH:-/home/KRAWL}', timeout=8)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

    networks:
      - highfishNetwork

volumes:
  krawl_data:
    driver: local

networks:
  highfishNetwork:
    external: true
