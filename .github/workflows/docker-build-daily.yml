# ============================================================
# Geplanter Upstream-Check
# Prüft täglich + manuell, ob BlessedRebuS/Krawl einen
# neuen Commit hat. Ist das Image für diesen Commit noch nicht auf
# ghcr.io gebaut (Tag "upstream-<sha>"), wird neu gebaut & gepusht.
# Die Registry selbst ist der "letzte gebaute Stand" (Tag-Existenz).
# Der Host-Build (docker-compose.yml) bleibt unverändert.
# ============================================================

name: Build & Push Docker Image to GHCR (Daily Upstream Check)

on:
  schedule:
    - cron: '30 3 * * *'   # täglich um 03:30 Uhr UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: BlessedRebuS/Krawl
  UPSTREAM_BRANCH: main

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Get upstream HEAD commit
        id: upstream
        run: |
          SHA="$(git ls-remote https://github.com/${{ env.UPSTREAM_REPO }}.git refs/heads/${{ env.UPSTREAM_BRANCH }} | cut -f1)"
          echo "sha=${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kein Neu-Build, wenn das Image für diesen Commit schon existiert.
      - name: Check whether image already built
        id: check
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:upstream-${{ steps.upstream.outputs.sha }}"
          if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            echo "Image vorhanden ($REF) – kein Rebuild noetig."
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "Neuer Upstream-Stand – Rebuild noetig."
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream source (build context)
        if: steps.check.outputs.build == 'yes'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}

      - name: Build and push
        if: steps.check.outputs.build == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:upstream-${{ steps.upstream.outputs.sha }}
