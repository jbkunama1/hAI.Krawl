name: CodeRabbit Secret Scan

on:
  schedule:
    - cron: '0 3 * * *'   # täglich um 03:00 Uhr UTC
  push:
    branches: [ main, master ]

jobs:
  coderabbit-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # gesamte Git-Historie scannen
      
      - name: Run CodeRabbit OSS
        uses: coderabbitio/codeRabbit@main
        with:
          extra_args: --only-verified