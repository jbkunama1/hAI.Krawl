# ============================================================
# GHCR Image Build
# Baut das Krawl-Image aus dem Upstream-Repo und
# pusht es auf ghcr.io. Läuft bei jedem Push (Commit) auf
# beliebige Branch, manuell per workflow_dispatch ausführbar.
# Der Stack (docker-compose.yml) holt das fertige Image aus ghcr.io.
# ============================================================

name: Build & Push Docker Image to GHCR

on:
  push:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref to build (branch/tag). Default: main'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: BlessedRebuS/Krawl
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream source (build context)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
