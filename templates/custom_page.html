<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome to nginx!</title>
    <style>
        body {
            width: 35em;
            margin: 0 auto;
            font-family: Tahoma, Verdana, Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
            padding-top: 40px;
        }
        h1 {
            color: #c0392b;
            font-size: 28px;
        }
        .counter {
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
        }
        a {
            color: #2980b9;
        }
        .links {
            background: #fff;
            border: 1px solid #ddd;
            padding: 16px 24px;
            border-radius: 4px;
            line-height: 2;
        }
    </style>
</head>
<body>
    <h1>Welcome to nginx!</h1>
    <p>If you see this page, the nginx web server is successfully installed and working. Further configuration is required.</p>
    <div class="counter">Requests: {counter}</div>

    <div class="links">
        {content}
    </div>

    <p><em>For online documentation and support please refer to <a href="#">nginx.org</a>.</em></p>
</body>
</html>
