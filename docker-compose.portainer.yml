# ============================================================
# Portainer Stack: Krawl
# Deploy via: Portainer > Stacks > Add Stack > Repository
# Repo URL: https://github.com/jbkunama1/hAI.Krawl
# Compose path: docker-compose.portainer.yml
# ============================================================

services:
  krawl:
    build:
      context: https://github.com/BlessedRebuS/Krawl.git
      dockerfile: Dockerfile
    image: krawl:latest
    container_name: hai-krawl
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - krawl_data:/app/data

    environment:
      - KRAWL_DASHBOARD_SECRET_PATH=${KRAWL_DASHBOARD_SECRET_PATH:-/dashboard}
      - KRAWL_LOG_LEVEL=${KRAWL_LOG_LEVEL:-INFO}
      - TZ=${TZ:-Europe/Berlin}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000${KRAWL_DASHBOARD_SECRET_PATH:-/dashboard}', timeout=8)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

    networks:
      - highfishNetwork

volumes:
  krawl_data:
    driver: local

networks:
  highfishNetwork:
    external: true